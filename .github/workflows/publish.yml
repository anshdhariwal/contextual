name: npm publish

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'npm publish')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: verify version was bumped
        run: |
          if ! git diff HEAD^ HEAD -- package.json | grep -q '"version"'; then
            echo "::error::commit mentions npm publish but package.json version did not change"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - run: npm publish --provenance
